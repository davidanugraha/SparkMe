<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Local preview for reviewing interviewer conduct and comparing candidate turns.">
  <title>SparkMe · Interview annotation</title>
  <link rel="stylesheet" href="styles.css">
  <script src="examples.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#reading">Skip to conversation</a>
  <header class="site-header">
    <a class="brand" href="./" aria-label="SparkMe annotation home"><span class="brand-mark" aria-hidden="true">s</span>SparkMe<span class="brand-divider"></span><span class="brand-subtitle">Annotation</span></a>
    <span class="preview-tag">Local preview</span>
  </header>
  <main class="workspace">
    <div class="workspace-heading">
      <div><h1>Interview annotation</h1><p class="intro" id="task-instruction"></p></div>
      <nav class="mode-switch" aria-label="Annotation task type">
        <button type="button" data-mode="conduct" aria-pressed="true">Conduct review</button>
        <button type="button" data-mode="preference" aria-pressed="false">A/B comparison</button>
      </nav>
    </div>
    <div class="task-toolbar">
      <label class="scenario-picker">Example <select id="scenario" aria-label="Choose example scenario"></select></label>
      <div class="task-navigation"><span id="task-position"></span><button id="previous" type="button" aria-label="Previous example"><span class="chevron previous" aria-hidden="true"></span></button><button id="next" type="button" aria-label="Next example"><span class="chevron" aria-hidden="true"></span></button></div>
    </div>
    <div class="review-layout">
      <section class="reading-column" id="reading" tabindex="-1" aria-label="Conversation and target turn">
        <section class="purpose-card" aria-labelledby="purpose-heading"><p class="eyebrow" id="purpose-heading">Interview purpose</p><p id="purpose"></p><p class="source-note" id="source-note"></p></section>
        <section class="conversation-card" aria-labelledby="conversation-heading">
          <div class="section-heading"><h2 id="conversation-heading">Conversation context</h2><span id="context-count"></span></div>
          <div class="history-control"><button type="button" id="history-toggle" aria-expanded="false" aria-controls="earlier-history"></button><p id="history-description"></p></div>
          <div id="earlier-history" hidden></div>
          <div id="recent-history"></div>
          <div id="target-area"></div>
        </section>
      </section>
      <aside class="annotation-panel" aria-labelledby="annotation-heading">
        <div class="annotation-header"><p class="eyebrow">Your assessment</p><h2 id="annotation-heading"></h2><p id="annotation-instruction"></p></div>
        <form id="annotation-form" novalidate>
          <div id="answer-controls"></div>
          <div class="note-field"><label for="explanation">Explanation <span>Optional</span></label><textarea id="explanation" rows="3" placeholder="What in the wording or context informed your assessment?"></textarea></div>
          <div class="submission-area"><p id="completion-hint"></p><button type="submit" class="submit-button" id="submit-button">Submit preview</button><p id="form-status" role="status" aria-live="polite"></p><p class="preview-disclosure">Preview answers stay in this tab until you reload or close it.</p></div>
        </form>
      </aside>
    </div>
    <footer> SparkMe interview evaluation <span>Display preview · Example content</span></footer>
  </main>
</body>
</html>
